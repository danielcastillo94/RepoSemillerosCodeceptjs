name: CI — Framework CodeceptJS

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install chromium

      - name: Ejecutar pruebas
        run: |
          npx codeceptjs run --features ./features/search_product.feature --steps
          npx codeceptjs run --features ./features/product_filters.feature --steps
          npx codeceptjs run --features ./features/product_detail.feature --steps
          npx codeceptjs run --features ./features/product_stock.feature --steps
          npx codeceptjs run --features ./features/product_reviews.feature --steps

      - name: Obtener historial de Allure
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generar reporte de Allure
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "gh-pages/history") {
            New-Item -ItemType Directory -Force -Path "output/allure-results" | Out-Null
            Copy-Item -Recurse -Force "gh-pages/history" "output/allure-results/history"
          }

          npx allure generate output/allure-results --clean -o allure-report

      - name: Publicar reporte en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report