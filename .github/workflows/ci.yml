name: CI — Framework CodeceptJS Leonel Perez

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegadores de Playwright
        run: npx playwright install chromium

      - name: Ejecutar pruebas
        run: npx codeceptjs run --features --grep '@episodios' --steps

      - name: Obtener historial de Allure
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
        
      - name: Instalar Java
        if: always()
        run: |
          apt-get update
          apt-get install -y openjdk-17-jre
          java -version

      - name: Generar reporte de Allure
        if: always()
        run: |
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history output/allure-results/history
          fi
          node_modules/.bin/allure generate output/allure-results --clean -o allure-report

      - name: Publicar reporte en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report